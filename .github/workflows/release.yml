name: Build & Release (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например, v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate app icon
        run: python app_icon.py

      - name: Build AutoCopy.exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name AutoCopy
          --icon assets/autocopy.ico
          --hidden-import pystray._win32
          --hidden-import pynput.mouse._win32
          --hidden-import pynput.keyboard._win32
          auto_copy.py

      - name: Check exe
        shell: pwsh
        run: Get-Item dist/AutoCopy.exe | Format-List Name, Length

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: AutoCopy ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/AutoCopy.exe
          body: |
            **AutoCopy** — копирование выделенного текста без Ctrl+C (Windows 10/11).

            1. Скачайте `AutoCopy.exe` ниже.
            2. Запустите — программа появится в трее (возле часов).
            3. Выделяйте текст мышью — он сразу копируется, со звуком и уведомлением.

            При первом запуске Windows SmartScreen может предупредить о неизвестном издателе:
            «Подробнее» → «Выполнить в любом случае».
